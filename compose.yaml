name: ${COMPOSE_PROJECT_NAME:-linea3d}

# Run from the repository root:
# make rebuild
# Requires Docker Compose >= 2.24.4 (include and !override support).
include:
  - path:
      - ./deploy/supabase/upstream/docker-compose.yml
      - ./deploy/supabase/compose.override.yaml
    env_file: ./deploy/compose.env

services:
  frontend:
    image: linea3d-frontend:release
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api-gw:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - ${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
